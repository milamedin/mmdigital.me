<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 250" width="970" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="price" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4eff"/>
      <stop offset="1" stop-color="#4a23c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0eaff"/>
    </linearGradient>
  </defs>

  <rect width="970" height="250" fill="url(#bg)"/>
  <circle cx="900" cy="40" r="160" fill="#6e3eff" opacity="0.12"/>

  <text x="60" y="60" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#B8A9FF">MM DIGITAL · PROMO</text>

  <text x="60" y="135" font-family="Georgia, serif" font-weight="700" font-size="64" fill="#FFFFFF">Sajt za 72h,</text>
  <text x="60" y="200" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="64" fill="#B8A9FF">kompletan paket.</text>

  <g transform="translate(690, 50)">
    <rect width="220" height="150" rx="16" fill="url(#price)"/>
    <rect width="220" height="150" rx="16" fill="url(#glow)"/>
    <text x="110" y="90" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="58" fill="#FFFFFF">799€</text>
    <line x1="50" y1="105" x2="170" y2="105" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <text x="110" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="2.5" fill="#FFFFFF" fill-opacity="0.92">SVE UKLJUČENO</text>
  </g>

  <g transform="translate(690, 215)">
    <rect width="220" height="22" rx="11" fill="url(#cta)"/>
    <text x="110" y="15" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#0A0A0A">Rezerviši svoj slot →</text>
  </g>
</svg>
