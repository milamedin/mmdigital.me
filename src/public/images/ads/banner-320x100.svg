  <rect width="320" height="100" fill="url(#bg)"/>
  <circle cx="290" cy="20" r="60" fill="#6e3eff" opacity="0.13"/>

  <text x="16" y="22" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="1.8" fill="#B8A9FF">MM DIGITAL · PROMO</text>

  <text x="16" y="52" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#FFFFFF">Sajt za 72h,</text>
