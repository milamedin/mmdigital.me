<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="price" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4eff"/>
      <stop offset="1" stop-color="#4a23c9"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0eaff"/>
    </linearGradient>
  </defs>

  <rect width="300" height="250" fill="url(#bg)"/>
  <circle cx="270" cy="20" r="60" fill="#6e3eff" opacity="0.15"/>

  <text x="20" y="36" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="10" letter-spacing="2" fill="#B8A9FF">MM DIGITAL · PROMO</text>

  <text x="20" y="80" font-family="Georgia, serif" font-weight="700" font-size="32" fill="#FFFFFF">Sajt za</text>
  <text x="20" y="115" font-family="Georgia, serif" font-weight="700" font-style="italic" font-size="32" fill="#B8A9FF">72h.</text>

  <g transform="translate(20, 135)">
    <rect width="120" height="56" rx="10" fill="url(#price)"/>
    <text x="60" y="36" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="28" fill="#FFFFFF">799€</text>
    <text x="60" y="50" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="7" letter-spacing="1.5" fill="#FFFFFF" fill-opacity="0.92">SVE UKLJUČENO</text>
  </g>

  <g transform="translate(20, 205)">
    <rect width="160" height="30" rx="15" fill="url(#cta)"/>
    <text x="80" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" fill="#0A0A0A">Rezerviši slot →</text>
  </g>
</svg>
