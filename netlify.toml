[build]
  command = "node build.mjs"
  publish = "dist"

# ─── 301 redirects ───
# Stari blog post "Koliko košta web sajt" obrisan, preusmjeren na Sajt za 72h
# Bio rangiran #1 za "koliko košta sajt", sad ide na ad landing.
[[redirects]]
  from = "/blog/koliko-kosta-web-sajt/"
  to = "/sajt-za-72h/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/koliko-kosta-web-sajt"
  to = "/sajt-za-72h/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
